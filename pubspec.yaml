name: esp32_arcade_app
description: Companion app for the ESP32-controlled coin-operated arcade basketball machine.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  liquid_glass_widgets: ^0.28.0
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  # Live updates from the ESP32 (WebSocket on port 81).
  web_socket_channel: ^3.0.1
  # Score / game-over sounds.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
